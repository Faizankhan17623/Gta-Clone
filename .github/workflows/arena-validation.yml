name: Arena validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: arena-protocol-project/game3d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: arena-protocol-project/game3d/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node --check ../server/server.js
